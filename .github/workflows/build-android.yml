name: Build Android APK

on:
  push:
    branches:
      - claude/continue-app-development-PuE6a
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Generate signing keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore release.keystore \
            -alias babydiary \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BabyDiary,O=Personal,C=KR" \
            -storepass babydiary -keypass babydiary

      - name: Wire keystore + bump JVM memory in gradle.properties
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=babydiary
          MYAPP_UPLOAD_STORE_PASSWORD=babydiary
          MYAPP_UPLOAD_KEY_PASSWORD=babydiary
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          EOF

      - name: Build Release APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Xmx5g -XX:MaxMetaspaceSize=2g'
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             artifacts/babydiary-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: babydiary-apk-${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 30
